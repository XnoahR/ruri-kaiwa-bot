name: tes

on:
  push:
    branches: [master, development]
  pull_request:
    branches: [master, development]
  workflow_dispatch:

jobs:
  tes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 itu yang ada di VPS; 3.12 buat menangkap hal yang bakal patah nanti.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Pasang ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Pasang dependensi
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q -r requirements.txt
          # Opsional di runtime, tapi di CI dipasang supaya tes romaji ikut jalan
          # alih-alih dilewati diam-diam.
          python -m pip install -q fugashi unidic-lite

      - name: Tes
        run: python -m unittest discover -s tests -v

      - name: Semua modul bisa diimpor
        run: |
          python - <<'PY'
          import ruri.audio, ruri.bot, ruri.config, ruri.dave
          import ruri.furigana, ruri.llm, ruri.providers
          import ruri.session, ruri.stt, ruri.tts
          from ruri.live import client, cog, pipe, prompt, protocol
          from ruri import config
          bot = ruri.bot.build(config.DEFAULTS)
          print("semua modul terimpor, bot terbangun:", type(bot).__name__)
          PY

      - name: Contoh config tetap sah dan lengkap
        run: |
          python - <<'PY'
          import json
          from ruri import config
          contoh = json.load(open("config.example.json"))
          kurang = set(config.DEFAULTS) - set(contoh)
          assert not kurang, "config.example.json ketinggalan kunci: %s" % kurang
          for bagian in ("llm", "fish", "stt", "kaiwa"):
              hilang = set(config.DEFAULTS[bagian]) - set(contoh[bagian])
              assert not hilang, "%s ketinggalan: %s" % (bagian, hilang)
          print("config.example.json sinkron dengan DEFAULTS")
          PY

      - name: Tidak ada rahasia yang lolos
        run: |
          if git grep -nE 'gsk_[A-Za-z0-9]{30}|sk-fish-[A-Za-z0-9_-]{20}|AIza[A-Za-z0-9_-]{30}|AQ\.[A-Za-z0-9_-]{30}' -- . ':!*.yml'; then
            echo "::error::ada yang mirip API key di dalam repo"
            exit 1
          fi
          echo "bersih"

  deploy:
    # Hanya dari master, dan hanya kalau seluruh matriks tes hijau. Deploy yang
    # bisa jalan tanpa tes lulus itu bukan CD, cuma rsync dengan langkah ekstra.
    needs: tes
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-produksi
      cancel-in-progress: false
    steps:
      - name: Siapkan kunci SSH
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy
        run: |
          # Kunci ini terkunci ke satu perintah di sisi server (update.sh),
          # jadi apa pun yang dikirim di sini diabaikan. Itu disengaja.
          ssh -i ~/.ssh/deploy -p "${{ secrets.SSH_PORT }}" \
              -o BatchMode=yes -o ConnectTimeout=45 \
              "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" true

      - name: Ringkasan
        run: echo "### Ter-deploy ke produksi :rocket:" >> $GITHUB_STEP_SUMMARY
